name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Test ETL pipeline
        working-directory: 02-azure-dataops-pipeline
        run: python -m pytest -q tests
